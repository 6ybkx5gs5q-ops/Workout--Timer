<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E0E0E">
<title>Workout Timer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --work: #FF4C1F; --rest: #00C27C; --bg: #0E0E0E; --surface: #181818;
    --border: #2A2A2A; --text: #F0EDE8; --muted: #666; --radius: 16px;
    --font-mono: ui-monospace, 'SF Mono', monospace;
    --font-display: -apple-system, 'SF Pro Display', 'Helvetica Neue', system-ui, sans-serif;
  }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font-mono);
    min-height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: max(1.5rem, env(safe-area-inset-top)) 1rem max(1.5rem, env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.4rem,5vw,2.4rem);
       letter-spacing: -0.02em; text-transform: uppercase; margin-bottom: 1.5rem; }
  .card { background: var(--surface); border: 1px solid var(--border);
          border-radius: var(--radius); padding: 1.25rem; width: 100%; max-width: 420px; }
  .settings { margin-bottom: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; transition: opacity .3s; }
  .settings.dimmed { opacity: .35; pointer-events: none; }
  .setting-row { display: flex; align-items: center; gap: 1rem; }
  .setting-label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); width: 90px; flex-shrink: 0; }
  .setting-label span { display: block; font-size: 13px; color: var(--text); letter-spacing: 0; text-transform: none; margin-top: 2px; font-weight: 500; }
  input[type="range"] { -webkit-appearance: none; appearance: none; flex: 1; height: 6px;
    border-radius: 3px; outline: none; cursor: pointer; min-height: 44px; background-clip: content-box; padding: 19px 0; }
  .range-work   { background: linear-gradient(to right, var(--work) var(--pct,50%), #2A2A2A var(--pct,50%)) content-box; }
  .range-rest   { background: linear-gradient(to right, var(--rest) var(--pct,50%), #2A2A2A var(--pct,50%)) content-box; }
  .range-rounds { background: linear-gradient(to right, #888 var(--pct,50%), #2A2A2A var(--pct,50%)) content-box; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px;
    border-radius: 50%; background: var(--text); cursor: pointer; transition: transform .15s; margin-top: -10px; }
  input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.15); }
  input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 0 0 1.5rem; }
  .timer-section { display: flex; flex-direction: column; align-items: center; gap: 1rem; padding: .25rem 0 .5rem; }
  .phase-tag { font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    padding: 5px 16px; border-radius: 99px; font-weight: 500; transition: background .3s, color .3s; }
  .tag-work  { background: rgba(255,76,31,.12); color: var(--work); }
  .tag-rest  { background: rgba(0,194,124,.12); color: var(--rest); }
  .tag-ready { background: rgba(240,237,232,.07); color: var(--muted); }
  .ring-wrap { position: relative; width: min(200px,55vw); height: min(200px,55vw); }
  .ring-wrap svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  #ringBg { fill: none; stroke: var(--border); stroke-width: 10; }
  #ringFg { fill: none; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .25s linear, stroke .4s; }
  .ring-inner { position: absolute; inset: 0; display: flex; flex-direction: column;
                align-items: center; justify-content: center; gap: 4px; }
  .big-num { font-family: var(--font-display); font-weight: 800; font-size: clamp(52px,15vw,72px);
             line-height: 1; font-variant-numeric: tabular-nums; }
  .round-info { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .stats { display: flex; gap: 1px; width: 100%; background: var(--border); border-radius: 10px; overflow: hidden; }
  .stat { flex: 1; background: var(--bg); padding: 10px 12px; text-align: center; }
  .stat:first-child { border-radius: 10px 0 0 10px; }
  .stat:last-child  { border-radius: 0 10px 10px 0; }
  .stat-val { font-size: 16px; font-weight: 500; }
  .stat-lbl { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
  .controls { display: flex; gap: 10px; width: 100%; margin-top: .5rem; }
  .btn { flex: 1; padding: 18px 14px; border-radius: 14px; font-family: var(--font-mono);
    font-size: 14px; letter-spacing: .06em; text-transform: uppercase; font-weight: 500; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--text);
    transition: background .15s, transform .1s; min-height: 56px;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .btn:hover { background: #222; } .btn:active { transform: scale(.97); }
  .btn-main { background: var(--text); color: var(--bg); border-color: transparent; flex: 2; }
  .btn-main:hover { background: #d8d5d0; }
  .btn-skip:disabled { opacity: .3; cursor: default; }
  .done-banner { display: none; text-align: center; padding: 12px; border-radius: 10px;
    background: rgba(0,194,124,.08); border: 1px solid rgba(0,194,124,.2);
    color: var(--rest); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; margin-top: .5rem; }
  .wake-badge { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: center; margin-top: .75rem; min-height: 16px; }
</style>
</head>
<body>
<h1>Workout Timer</h1>
<div class="card">
  <div class="settings" id="settingsBlock">
    <div class="setting-row">
      <div class="setting-label">Belastung<span id="workVal">30 sek</span></div>
      <input type="range" id="workSlider" class="range-work" min="5" max="120" step="5" value="30">
    </div>
    <div class="setting-row">
      <div class="setting-label">Pause<span id="restVal">10 sek</span></div>
      <input type="range" id="restSlider" class="range-rest" min="5" max="60" step="5" value="10">
    </div>
    <div class="setting-row">
      <div class="setting-label">Runden<span id="roundsVal">∞</span></div>
      <input type="range" id="roundsSlider" class="range-rounds" min="0" max="20" step="1" value="0">
    </div>
  </div>
  <hr class="divider">
  <div class="timer-section">
    <div class="phase-tag tag-ready" id="phaseTag">Bereit</div>
    <div class="ring-wrap">
      <svg width="200" height="200" viewBox="0 0 200 200">
        <circle id="ringBg" cx="100" cy="100" r="88"/>
        <circle id="ringFg" cx="100" cy="100" r="88"/>
      </svg>
      <div class="ring-inner">
        <div class="big-num" id="bigNum">–</div>
        <div class="round-info" id="roundInfo">Runde –</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-val" id="statSets">0</div><div class="stat-lbl">Sätze</div></div>
      <div class="stat"><div class="stat-val" id="statTotal">0:00</div><div class="stat-lbl">Gesamt</div></div>
      <div class="stat"><div class="stat-val" id="statNext">–</div><div class="stat-lbl">Nächste</div></div>
    </div>
    <div class="controls">
      <button class="btn btn-main" id="mainBtn" onclick="toggleTimer()">Start</button>
      <button class="btn btn-skip" id="skipBtn" onclick="skipPhase()" disabled>Skip</button>
      <button class="btn" onclick="resetTimer()">Reset</button>
    </div>
    <div class="done-banner" id="doneBanner">Workout abgeschlossen!</div>
  </div>
</div>
<div class="wake-badge" id="wakeBadge"></div>

<script>
const CIRC = 2 * Math.PI * 88;

let workTime = 30, restTime = 10, maxRounds = 0;
let phase = 'idle', running = false;
let currentRound = 0;
let phaseStartTime = null, phaseDuration = 0, sessionStart = null, remainingAtPause = 0;
let interval = null, wakeLock = null;
let audioCtx = null, silentSource = null;

// ── Audio ─────────────────────────────────────────────────────────────────────
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

// Looping silent buffer — runs entirely in the Web Audio scheduler (no JS needed).
// This keeps the iOS audio session alive even when JS is frozen in background.
function startSilentLoop() {
  if (!audioCtx || silentSource) return;
  // 2 seconds of silence; looped = infinite, no JS reschedule needed
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.loop = true; // Web Audio engine loops this, not JS
  src.connect(audioCtx.destination);
  src.start(0);
  silentSource = src;
}

function stopSilentLoop() {
  if (silentSource) { try { silentSource.stop(); } catch(e) {} silentSource = null; }
}

function beep(type) {
  if (!audioCtx) return;
  const doBeep = () => {
    const plays = type === 'work' ? [[880,0],[880,.15]]
                : type === 'rest' ? [[440,0]]
                : [[660,0],[550,.2],[440,.4]];
    plays.forEach(([freq, t]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.45, audioCtx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + .22);
      o.start(audioCtx.currentTime + t);
      o.stop(audioCtx.currentTime + t + .25);
    });
  };
  audioCtx.state === 'suspended' ? audioCtx.resume().then(doBeep) : doBeep();
}

function vibrate(type) {
  if (!navigator.vibrate) return;
  if (type === 'work') navigator.vibrate([80,60,80]);
  else if (type === 'rest') navigator.vibrate([200]);
  else navigator.vibrate([100,80,100,80,300]);
}

// ── Wake Lock ──────────────────────────────────────────────────────────────────
async function requestWakeLock() {
  if (!('wakeLock' in navigator) || wakeLock) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    document.getElementById('wakeBadge').textContent = '⚡ Bildschirm aktiv';
    wakeLock.addEventListener('release', () => { wakeLock = null; document.getElementById('wakeBadge').textContent = ''; });
  } catch(e) {}
}
function releaseWakeLock() {
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
  document.getElementById('wakeBadge').textContent = '';
}

// ── Settings ───────────────────────────────────────────────────────────────────
function saveSettings() { localStorage.setItem('wt_w',workTime); localStorage.setItem('wt_r',restTime); localStorage.setItem('wt_n',maxRounds); }
function loadSettings() {
  workTime  = +localStorage.getItem('wt_w') || 30;
  restTime  = +localStorage.getItem('wt_r') || 10;
  maxRounds = +localStorage.getItem('wt_n') || 0;
  document.getElementById('workSlider').value   = workTime;
  document.getElementById('restSlider').value   = restTime;
  document.getElementById('roundsSlider').value = maxRounds;
  document.getElementById('workVal').textContent   = workTime + ' sek';
  document.getElementById('restVal').textContent   = restTime + ' sek';
  document.getElementById('roundsVal').textContent = maxRounds === 0 ? '∞' : maxRounds;
  updateFill(document.getElementById('workSlider'),   5, 120);
  updateFill(document.getElementById('restSlider'),   5,  60);
  updateFill(document.getElementById('roundsSlider'), 0,  20);
}
function updateFill(el, min, max) { el.style.setProperty('--pct', ((el.value-min)/(max-min)*100).toFixed(1)+'%'); }

document.getElementById('workSlider').addEventListener('input', function() {
  workTime = +this.value; document.getElementById('workVal').textContent = workTime+' sek'; updateFill(this,5,120); saveSettings(); });
document.getElementById('restSlider').addEventListener('input', function() {
  restTime = +this.value; document.getElementById('restVal').textContent = restTime+' sek'; updateFill(this,5,60); saveSettings(); });
document.getElementById('roundsSlider').addEventListener('input', function() {
  maxRounds = +this.value; document.getElementById('roundsVal').textContent = maxRounds===0?'∞':maxRounds; updateFill(this,0,20); saveSettings(); });

// ── Timer core ─────────────────────────────────────────────────────────────────
function getRemaining() { return !phaseStartTime ? 0 : Math.max(0, phaseDuration - Math.floor((Date.now()-phaseStartTime)/1000)); }
function getTotalSec()  { return sessionStart ? Math.floor((Date.now()-sessionStart)/1000) : 0; }
function fmt(s)         { return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

const ringFg   = document.getElementById('ringFg');
const phaseTag = document.getElementById('phaseTag');

function setRing(val, max, color) {
  ringFg.style.strokeDasharray  = CIRC;
  ringFg.style.strokeDashoffset = CIRC * (1 - Math.max(0,val)/max);
  ringFg.style.stroke = color;
}

function updateDisplay() {
  const rem = phase==='idle' ? 0 : getRemaining();
  document.getElementById('bigNum').textContent    = phase==='idle' ? '–' : rem;
  document.getElementById('statSets').textContent  = currentRound;
  document.getElementById('statTotal').textContent = fmt(phase==='idle'?0:getTotalSec());
  if (phase==='work') {
    phaseTag.textContent='Belastung'; phaseTag.className='phase-tag tag-work';
    setRing(rem, phaseDuration, '#FF4C1F');
    document.getElementById('statNext').textContent  = restTime+'s';
    document.getElementById('roundInfo').textContent = 'Runde '+currentRound+(maxRounds>0?' / '+maxRounds:'');
  } else if (phase==='rest') {
    phaseTag.textContent='Pause'; phaseTag.className='phase-tag tag-rest';
    setRing(rem, phaseDuration, '#00C27C');
    document.getElementById('statNext').textContent  = workTime+'s';
    document.getElementById('roundInfo').textContent = 'Runde '+currentRound+(maxRounds>0?' / '+maxRounds:'');
  } else {
    phaseTag.textContent='Bereit'; phaseTag.className='phase-tag tag-ready';
    ringFg.style.strokeDasharray=CIRC; ringFg.style.strokeDashoffset=CIRC; ringFg.style.stroke='#2A2A2A';
    document.getElementById('statNext').textContent='–'; document.getElementById('roundInfo').textContent='Runde –';
  }
}

function startPhase(newPhase, round) {
  phase=newPhase; currentRound=round;
  phaseDuration = newPhase==='work' ? workTime : restTime;
  phaseStartTime = Date.now();
}

function tick() {
  if (!running || phase==='idle') return;
  while (getRemaining() <= 0) {
    if (phase==='work') {
      if (maxRounds>0 && currentRound>=maxRounds) { finishWorkout(); return; }
      beep('rest'); vibrate('rest'); startPhase('rest', currentRound);
    } else {
      beep('work'); vibrate('work'); startPhase('work', currentRound+1);
    }
  }
  updateDisplay();
}

function finishWorkout() {
  clearInterval(interval); interval=null; running=false; phase='idle';
  stopSilentLoop(); releaseWakeLock();
  document.getElementById('mainBtn').textContent='Start';
  document.getElementById('skipBtn').disabled=true;
  document.getElementById('doneBanner').style.display='block';
  document.getElementById('settingsBlock').classList.remove('dimmed');
  beep('done'); vibrate('done'); updateDisplay();
}

// ── Controls ───────────────────────────────────────────────────────────────────
function toggleTimer() {
  initAudio();
  if (audioCtx.state==='suspended') audioCtx.resume();

  if (phase==='idle') {
    document.getElementById('doneBanner').style.display='none';
    sessionStart=Date.now(); startPhase('work',1); running=true;
    startSilentLoop();
    beep('work'); vibrate('work');
    interval=setInterval(tick,200);
    document.getElementById('mainBtn').textContent='Pause';
    document.getElementById('skipBtn').disabled=false;
    document.getElementById('settingsBlock').classList.add('dimmed');
    requestWakeLock();
  } else if (running) {
    remainingAtPause=getRemaining();
    clearInterval(interval); interval=null; running=false;
    stopSilentLoop(); releaseWakeLock();
    document.getElementById('mainBtn').textContent='Weiter';
    document.getElementById('skipBtn').disabled=true;
  } else {
    phaseStartTime=Date.now()-(phaseDuration-remainingAtPause)*1000;
    running=true;
    startSilentLoop();
    interval=setInterval(tick,200);
    document.getElementById('mainBtn').textContent='Pause';
    document.getElementById('skipBtn').disabled=false;
    requestWakeLock();
  }
  updateDisplay();
}

function skipPhase() {
  if (!running || phase==='idle') return;
  if (phase==='work') {
    if (maxRounds>0 && currentRound>=maxRounds) { finishWorkout(); return; }
    beep('rest'); vibrate('rest'); startPhase('rest',currentRound);
  } else { beep('work'); vibrate('work'); startPhase('work',currentRound+1); }
  updateDisplay();
}

function resetTimer() {
  clearInterval(interval); interval=null;
  stopSilentLoop(); releaseWakeLock();
  running=false; phase='idle'; currentRound=0; sessionStart=null; phaseStartTime=null;
  document.getElementById('mainBtn').textContent='Start';
  document.getElementById('skipBtn').disabled=true;
  document.getElementById('doneBanner').style.display='none';
  document.getElementById('settingsBlock').classList.remove('dimmed');
  updateDisplay();
}

// ── Visibility change (Fallback) ───────────────────────────────────────────────
// Silent loop keeps AudioContext alive, but this is a safety net.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState==='visible' && running) {
    if (audioCtx && audioCtx.state==='suspended') {
      audioCtx.resume().then(() => { beep(phase==='work'?'work':'rest'); vibrate(phase==='work'?'work':'rest'); });
    }
    startSilentLoop();
    requestWakeLock();
    tick();
  }
});

// ── Init ───────────────────────────────────────────────────────────────────────
loadSettings();
updateDisplay();
</script>
</body>
</html>
